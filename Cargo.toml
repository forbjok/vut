[profile.release]
codegen-units = 1
lto = true
opt-level = "z"

[workspace]
resolver = "2"

members = ["cli", "lib"]

[workspace.dependencies]
clap = "4.6.1"
encoding_rs = "0.8.35"
globset = "0.4.18"
regex = "1.12.4"
serde = "1.0.228"
serde_derive = "1.0.228"
serde_json = "1.0.150"
strum = "0.28.0"
strum_macros = "0.28.0"
thiserror = "2.0.18"
toml = "1.1.2"
toml_edit = "0.25.12"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
walkdir = "2.5.0"
