[profile.release]
codegen-units = 1
lto = true
opt-level = "z"

[workspace]
resolver = "2"

members = ["cli", "lib"]

[workspace.dependencies]
clap = "4.6.9"
encoding_rs = "0.8.44"
globset = "0.4.21"
regex = "1.13.2"
serde = "1.0.229"
serde_derive = "1.0.229"
serde_json = "1.0.154"
strum = "0.28.0"
strum_macros = "0.28.0"
thiserror = "2.0.21"
toml = "1.2.1"
toml_edit = "0.25.19"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
walkdir = "2.5.0"
